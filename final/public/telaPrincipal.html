<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro de Personagens</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(120deg, #3498db, #6dd5fa);
      padding: 40px 20px;
      min-height: 100vh;
    }

    h1 {
      text-align: center;
      color: white;
      margin-bottom: 30px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      background: white;
      border-radius: 1rem;
      padding: 2rem;
      box-shadow: 0 0 20px rgba(0,0,0,0.15);
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .atualizar-btn {
  margin-top: 10px;
  padding: 6px 12px;
  background-color: #f1c40f;
  color: white;
  border: none;
  border-radius: 5px;
  cursor: pointer;
  font-size: 0.9rem;
  margin-left: 10px;
  transition: background 0.3s;
}

.atualizar-btn:hover {
  background-color: #d4ac0d;
}

    .form-group label {
      display: block;
      margin-bottom: 0.3rem;
      color: #333;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #ccc;
      border-radius: 0.5rem;
      font-size: 1rem;
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    .btn {
      width: 100%;
      padding: 0.9rem;
      background-color: #2980b9;
      color: white;
      font-size: 1rem;
      border: none;
      border-radius: 0.5rem;
      cursor: pointer;
      transition: background 0.3s;
      margin-top: 10px;
    }

    .btn:hover {
      background-color: #1f618d;
    }

    #mensagem {
      text-align: center;
      margin-top: 10px;
      font-weight: bold;
    }

    .personagem {
      display: flex;
      align-items: flex-start;
      gap: 15px;
      background: white;
      border-radius: 1rem;
      padding: 1rem;
      margin-top: 15px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    .personagem img {
      width: 90px;
      height: 90px;
      object-fit: cover;
      border-radius: 0.7rem;
      border: 2px solid #2980b9;
    }

    .info h3 {
      margin: 0 0 5px;
      color: #2980b9;
    }

    .info p {
      margin: 0;
      color: #444;
    }
    .excluir-btn {
  margin-top: 10px;
  padding: 6px 12px;
  background-color: #e74c3c;
  color: white;
  border: none;
  border-radius: 5px;
  cursor: pointer;
  font-size: 0.9rem;
  transition: background 0.3s;
}

.excluir-btn:hover {
  background-color: #c0392b;
}

  </style>
</head>
<body>

  <h1>Cadastro de Personagens</h1>

  <div class="container">
    <div class="form-group">
      <label for="nome">Nome</label>
      <input type="text" id="nome" placeholder="Ex: Link, Mario, Lara Croft" />
    </div>
    <div class="form-group">
      <label for="descricao">Descrição</label>
      <textarea id="descricao" placeholder="Fale um pouco sobre o personagem..."></textarea>
    </div>
    <div class="form-group">
      <label for="imagem">URL da Imagem</label>
      <input type="url" id="imagem" placeholder="Cole aqui o link da imagem" />
    </div>
    <button class="btn" onclick="cadastrarPersonagem()">Cadastrar Personagem</button>

    <p id="mensagem"></p>

    <!-- Lista de personagens abaixo -->
    <div id="lista-personagens"></div>
  </div>

  <script>
    let idEmEdicao = null;
    function prepararAtualizacao(id, nome, descricao, imagem) {
  document.getElementById('nome').value = nome;
  document.getElementById('descricao').value = descricao;
  document.getElementById('imagem').value = imagem;
  idEmEdicao = id;

  const botao = document.querySelector('.btn');
  botao.innerText = 'Salvar Alterações';
}
  
    async function carregarPersonagens() {
      const lista = document.getElementById('lista-personagens');
      lista.innerHTML = ''; // limpa a lista
  
      try {
        const res = await fetch("http://localhost:3000/api/personagens");
        if (res.ok) {
          const personagens = await res.json();
  
          personagens.forEach(p => {
            const div = document.createElement('div');
            div.className = 'personagem';
            div.innerHTML = `
  <img src="${p.imgUrl}" alt="${p.nome}">
  <div class="info">
    <h3>${p.nome}</h3>
    <p>${p.descricao}</p>
    <button class="excluir-btn" onclick="excluirPersonagem('${p.id}', this)">Excluir</button>
    <button class="atualizar-btn" onclick="prepararAtualizacao('${p.id}', '${p.nome}', '${p.descricao}', '${p.imgUrl}')">Atualizar</button>
  </div>
`;

            lista.appendChild(div);
          });
        } else {
          document.getElementById('mensagem').innerText = 'Erro ao carregar personagens.';
        }
      } catch (error) {
        document.getElementById('mensagem').innerText = 'Erro na API: ' + error.message;
      }
    }
  
    // Carregar assim que a página for aberta
    document.addEventListener('DOMContentLoaded', carregarPersonagens);
    async function excluirPersonagem(id, botao) {
  if (!confirm('Tem certeza que deseja excluir este personagem?')) return;

  try {
    const res = await fetch(`http://localhost:3000/api/personagens/${id}`, {
      method: 'DELETE'
    });

    if (res.ok) {
      // Remove o card da tela
      const card = botao.closest('.personagem');
      card.remove();
    } else {
      alert('Erro ao excluir personagem');
    }
  } catch (error) {
    alert('Erro na requisição: ' + error.message);
  }
}async function cadastrarPersonagem() {
  const nome = document.getElementById('nome').value.trim();
  const descricao = document.getElementById('descricao').value.trim();
  const imgUrl = document.getElementById('imagem').value.trim();
  const mensagem = document.getElementById('mensagem');

  if (!nome || !descricao || !imgUrl) {
    mensagem.style.color = 'red';
    mensagem.innerText = 'Erro 400: Preencha todos os campos!';
    return;
  }

  try {
    let res;
    if (idEmEdicao) {
      // Atualizar personagem existente
      res = await fetch(`http://localhost:3000/api/personagens/${idEmEdicao}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ nome, descricao, imgUrl })
      });
    } else {
      // Cadastrar novo personagem
      res = await fetch("http://localhost:3000/api/personagens", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ nome, descricao, imgUrl })
      });
    }

    if (res.ok) {
      mensagem.style.color = 'green';
      mensagem.innerText = idEmEdicao
        ? 'Personagem atualizado com sucesso!'
        : 'Personagem cadastrado com sucesso!';

      // Limpar campos
      document.getElementById('nome').value = '';
      document.getElementById('descricao').value = '';
      document.getElementById('imagem').value = '';
      document.querySelector('.btn').innerText = 'Cadastrar Personagem';
      idEmEdicao = null;

      carregarPersonagens(); // atualiza a lista
    } else {
      const data = await res.json();
      mensagem.style.color = 'red';
      mensagem.innerText = data.message || "Erro ao salvar.";
    }
  } catch (error) {
    mensagem.style.color = 'red';
    mensagem.innerText = "Erro na requisição: " + error.message;
  }
}


  </script>
  

</body>
</html>
