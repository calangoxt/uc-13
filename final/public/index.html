<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login e Cadastro</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="container">

    <!-- Tela de Login -->
    <div id="login-box">
      <h2>Login</h2>
      <form id="login-form">
        <div class="form-group">
          <label for="login-user">Usuário</label>
          <input type="text" id="login-user" placeholder="Digite seu usuário" required />
        </div>
        <div class="form-group">
          <label for="login-pass">Senha</label>
          <input type="password" id="login-pass" placeholder="Digite sua senha" required />
        </div>
        <button class="btn" type="submit">Entrar</button>
      </form>
      <div class="toggle">Não tem conta? <a onclick="mostrarCadastro()">Cadastre-se</a></div>
      <div class="msg" id="login-msg"></div>
    </div>

    <!-- Tela de Cadastro -->
    <div id="cadastro-box" class="hidden">
      <h2>Cadastro</h2>
      <form id="cadastro-form">
        <div class="form-group">
          <label for="cad-nome">Nome</label>
          <input type="text" id="cad-nome" placeholder="Digite seu nome" required />
        </div>
        <div class="form-group">
          <label for="cad-email">E-mail</label>
          <input type="email" id="cad-email" placeholder="Digite seu e-mail" required />
        </div>
        <div class="form-group">
          <label for="cad-senha">Senha</label>
          <input type="password" id="cad-senha" placeholder="Digite uma senha" required />
        </div>
        <button class="btn" type="submit">Cadastrar</button>
      </form>
      <div class="toggle">Já tem conta? <a onclick="mostrarLogin()">Entrar</a></div>
      <div class="msg" id="cadastro-msg"></div>
    </div>

  </div>

  <script src="./script.js" defer></script>
</body>
</html>
